# PostgreSQL JDBC driver (pgjdbc) profile.
#
# Source: https://github.com/pgjdbc/pgjdbc
#
# The generic analyzer correctly identifies all entry classes for pgjdbc
# after the resolver fixes. Bug 4 (throw-only body) already catches stubs
# that use `throw Driver.notImplemented(...)` because the `throw` keyword
# is present at the call site.
#
# This profile pins the canonical entry classes so future analyzer changes
# can't shift them, and records the package prefix for auto-detection.
# No stubHelpers needed.

name: pgjdbc
displayName: "PostgreSQL JDBC"

detectBy:
  packagePrefix:
    - org.postgresql

entryClasses:
  java.sql.Connection: org.postgresql.jdbc.PgConnection
  java.sql.Statement: org.postgresql.jdbc.PgStatement
  java.sql.PreparedStatement: org.postgresql.jdbc.PgPreparedStatement
  java.sql.CallableStatement: org.postgresql.jdbc.PgCallableStatement
  java.sql.ResultSet: org.postgresql.jdbc.PgResultSet
  java.sql.DatabaseMetaData: org.postgresql.jdbc.PgDatabaseMetaData
  java.sql.ResultSetMetaData: org.postgresql.jdbc.PgResultSetMetaData
  java.sql.ParameterMetaData: org.postgresql.jdbc.PgParameterMetaData
  java.sql.Driver: org.postgresql.Driver
  java.sql.Blob: org.postgresql.jdbc.PgBlob
  java.sql.Clob: org.postgresql.jdbc.PgClob
  java.sql.SQLXML: org.postgresql.jdbc.PgSQLXML
  java.sql.Array: org.postgresql.jdbc.PgArray
